name: Terraform Plan

on:
  pull_request:
    paths:
      - "envs/**"
      - "modules/**"
      - ".github/workflows/terraform-plan.yml"
      - ".github/scripts/**"

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: envs/prod
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP || 'exit-prod' }}
  TF_RUNNER_VM_NAME: ${{ vars.TF_RUNNER_VM_NAME || 'exit-tf-runner' }}
  TF_RUNNER_LABEL: ${{ vars.TF_RUNNER_LABEL || 'exit-terraform' }}

jobs:
  start-runner:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.runner.outputs.runs_on }}
      use_self_hosted: ${{ steps.runner.outputs.use_self_hosted }}
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Terraform runner host
        id: runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if az vm show --resource-group "${RESOURCE_GROUP}" --name "${TF_RUNNER_VM_NAME}" >/dev/null 2>&1; then
            echo "use_self_hosted=true" >> "$GITHUB_OUTPUT"
            echo 'runs_on=["self-hosted","exit-terraform"]' >> "$GITHUB_OUTPUT"
            bash .github/scripts/terraform-runner-vm.sh start
          else
            echo "Runner VM not found — bootstrap plan on GitHub-hosted."
            echo "use_self_hosted=false" >> "$GITHUB_OUTPUT"
            echo 'runs_on=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: start-runner
    runs-on: ${{ fromJSON(needs.start-runner.outputs.runs_on) }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Node.js for GitHub Actions
        if: needs.start-runner.outputs.use_self_hosted == 'true'
        run: |
          if ! node --version 2>/dev/null | grep -qE '^v2[0-9]'; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi
          node --version

      - name: Ensure Terraform CLI
        if: needs.start-runner.outputs.use_self_hosted == 'true'
        run: |
          if ! terraform version 2>/dev/null | grep -q '1.16.'; then
            sudo apt-get install -y unzip
            curl -fsSL https://releases.hashicorp.com/terraform/1.16.0/terraform_1.16.0_linux_amd64.zip -o /tmp/terraform.zip
            sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
            rm -f /tmp/terraform.zip
          fi
          terraform version

      - name: Validate Azure secrets are configured
        run: |
          for VAR in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID TF_STATE_RESOURCE_GROUP TF_STATE_STORAGE_ACCOUNT TF_STATE_CONTAINER SHOPIFY_API_KEY SHOPIFY_API_SECRET CI_RUNNER_SSH_PUBLIC_KEY; do
            if [ -z "${!VAR:-}" ]; then
              echo "::error::Missing secret: ${VAR}"
              exit 1
            fi
          done
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_STATE_RESOURCE_GROUP: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
          TF_STATE_CONTAINER: ${{ secrets.TF_STATE_CONTAINER }}
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          CI_RUNNER_SSH_PUBLIC_KEY: ${{ secrets.CI_RUNNER_SSH_PUBLIC_KEY }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        if: needs.start-runner.outputs.use_self_hosted != 'true'
        with:
          terraform_version: 1.16.0

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_shopify_api_key: ${{ secrets.SHOPIFY_API_KEY }}
          TF_VAR_shopify_api_secret: ${{ secrets.SHOPIFY_API_SECRET }}
          TF_VAR_shopify_app_url: ${{ vars.SHOPIFY_APP_URL }}
          TF_VAR_ci_runner_ssh_public_key: ${{ secrets.CI_RUNNER_SSH_PUBLIC_KEY }}
          TF_VAR_key_vault_public_network_access_enabled: ${{ needs.start-runner.outputs.use_self_hosted == 'true' && 'false' || 'true' }}
        run: terraform plan -no-color -out=tfplan

      - name: Show Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -no-color tfplan

  stop-runner:
    needs:
      - start-runner
      - plan
    if: always() && needs.start-runner.result == 'success' && needs.start-runner.outputs.use_self_hosted == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stop Terraform runner VM
        run: bash .github/scripts/terraform-runner-vm.sh stop
